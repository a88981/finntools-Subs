<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>字幕工作台</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: linear-gradient(135deg,#e8f8f5 0%,#f5fbf8 40%,#fdfbee 80%,#fffde8 100%);
  background-attachment: fixed;
  color: #2a5550;
  font-family: 'Microsoft JhengHei','PingFang TC',sans-serif;
  min-height: 100vh;
  padding: 32px 20px 60px;
  display: flex; flex-direction: column; align-items: center;
}
header { text-align: center; margin-bottom: 20px; }
header h1 { font-size: 1.5rem; font-weight: 800; color: #2a5550; letter-spacing: 0.04em; margin-bottom: 6px; }
header p { font-size: 0.75rem; color: #5ab5ac; font-weight: 700; letter-spacing: 0.04em; }

.wrap { width: 100%; max-width: 900px; display: flex; flex-direction: column; gap: 16px; }

.steps { display: flex; align-items: center; gap: 0; margin-bottom: 4px; justify-content: center; width: 100%; }
.stp { display: flex; align-items: center; gap: 6px; flex: 0 0 auto; }
.stp-n { width: 26px; height: 26px; border-radius: 50%; background: rgba(255,255,255,0.8); border: 2px solid rgba(110,196,188,0.35); font-size: 0.68rem; font-weight: 800; display: flex; align-items: center; justify-content: center; color: #8dd0c8; flex-shrink: 0; transition: all 0.3s; }
.stp.active .stp-n { background: #6ec4bc; border-color: #6ec4bc; color: white; box-shadow: 0 2px 8px rgba(110,196,188,0.35); }
.stp.done .stp-n { background: #6ec4bc; border-color: #6ec4bc; color: white; }
.stp-l { font-size: 0.62rem; color: #8dd0c8; white-space: nowrap; font-weight: 700; }
.stp.active .stp-l, .stp.done .stp-l { color: #4aada5; }
.stp-line { flex: 1; height: 2px; background: rgba(110,196,188,0.2); margin: 0 4px; border-radius: 2px; min-width: 16px; }

.card { background: rgba(255,255,255,0.88); border: 1.5px solid rgba(110,196,188,0.2); border-radius: 16px; padding: 22px 24px; box-shadow: 0 3px 20px rgba(110,196,188,0.1); }
.card-title { font-size: 0.72rem; font-weight: 800; color: #4aada5; letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 16px; }
.card-title::before { content: '✦ '; }

.setup-strip { display: flex; align-items: stretch; gap: 4px; padding: 4px; flex-wrap: wrap; }
.setup-item { display: flex; gap: 10px; flex: 1; min-width: 220px; padding: 10px 12px; border-radius: 12px; transition: background 0.2s, border-color 0.2s; border: 1.5px dashed rgba(110,196,188,0.3); }
.setup-item.dragover { background: rgba(110,196,188,0.12); border-color: #6ec4bc; }
.setup-item.loaded { border-style: solid; border-color: rgba(110,196,188,0.4); background: rgba(232,248,245,0.5); }
.setup-item.loaded .si-n { background: #6ec4bc; color: white; }
.si-n { flex-shrink: 0; width: 22px; height: 22px; border-radius: 50%; background: rgba(110,196,188,0.18); color: #4aada5; font-size: 0.66rem; font-weight: 800; display: flex; align-items: center; justify-content: center; margin-top: 1px; }
.si-body { min-width: 0; flex: 1; }
.si-t { font-size: 0.76rem; font-weight: 800; color: #2a5550; margin-bottom: 6px; }
.si-sub { display: block; font-size: 0.62rem; font-weight: 600; color: #a8d4ce; margin-top: 2px; }
.si-s { display: block; font-size: 0.64rem; font-weight: 700; color: #5ab5ac; margin-top: 6px; word-break: break-all; }
.si-div { width: 1.5px; background: rgba(110,196,188,0.18); flex-shrink: 0; align-self: stretch; }

.btn { background: #6ec4bc; border: none; border-radius: 100px; color: white; cursor: pointer; font-family: inherit; font-size: 0.78rem; font-weight: 800; letter-spacing: 0.04em; padding: 11px 22px; transition: all 0.2s; box-shadow: 0 3px 12px rgba(110,196,188,0.3); }
.btn:hover { background: #5ab5ac; transform: translateY(-1px); box-shadow: 0 5px 16px rgba(110,196,188,0.4); }
.btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }
.btn-ghost { background: rgba(255,255,255,0.8); border: 1.5px solid rgba(110,196,188,0.3); border-radius: 100px; color: #5ab5ac; cursor: pointer; font-family: inherit; font-size: 0.75rem; font-weight: 700; padding: 9px 16px; transition: all 0.2s; }
.btn-ghost:hover { border-color: #6ec4bc; color: #4aada5; background: white; }
.btn-sm { background: rgba(255,255,255,0.8); border: 1.5px solid rgba(110,196,188,0.25); border-radius: 100px; color: #5ab5ac; cursor: pointer; font-size: 0.65rem; font-weight: 700; padding: 6px 14px; transition: all 0.2s; font-family: inherit; position: relative; overflow: hidden; }
.btn-sm:hover { border-color: #6ec4bc; color: #4aada5; }
.btn-sm input[type=file] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

.row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; align-items: center; }
.info-box { background: rgba(232,248,245,0.65); border: 1.5px solid rgba(110,196,188,0.15); border-radius: 12px; padding: 14px 16px; font-size: 0.72rem; line-height: 1.9; color: #3a7872; font-weight: 600; }
.info-box strong { color: #2a5550; }

textarea.paste-area { background: rgba(232,248,245,0.5); border: 1.5px solid rgba(110,196,188,0.2); border-radius: 12px; color: #2a5550; font-size: 0.73rem; line-height: 1.7; min-height: 140px; outline: none; padding: 14px; resize: vertical; width: 100%; margin-top: 10px; font-family: inherit; font-weight: 600; }
textarea.paste-area:focus { border-color: #6ec4bc; box-shadow: 0 0 0 3px rgba(110,196,188,0.12); }

#stageFrame { width: 100%; height: 88vh; border: none; border-radius: 16px; background: white; box-shadow: 0 3px 20px rgba(110,196,188,0.1); }

.done-icon { font-size: 2.2rem; text-align: center; margin-bottom: 10px; }
</style>
</head>
<body>

<header>
  <h1>字幕工作台</h1>
  <p>糾察 → 精準分段 → 剪輯點對齊，一次跑完</p>
</header>

<div class="wrap">

  <div class="steps" id="stepBar">
    <div class="stp active" id="gs0"><div class="stp-n">1</div><div class="stp-l">上傳</div></div>
    <div class="stp-line"></div>
    <div class="stp" id="gs1"><div class="stp-n">2</div><div class="stp-l">內容糾察</div></div>
    <div class="stp-line"></div>
    <div class="stp" id="gs2"><div class="stp-n">3</div><div class="stp-l">分段／對齊</div></div>
    <div class="stp-line"></div>
    <div class="stp" id="gs3"><div class="stp-n">4</div><div class="stp-l">完成</div></div>
  </div>

  <!-- 上傳階段 -->
  <div id="stage-upload">
    <div class="card">
      <div class="card-title">一次上傳三個檔案</div>
      <div class="info-box" style="margin-bottom:14px;">
        字幕 SRT 是唯一必要的；剪輯點 XML 和影片／音檔都是選填 —— 沒有 XML 就不會進「剪輯點對齊」那一關，直接分段完成；沒有影片，中途也可以隨時再補。
      </div>
      <div class="setup-strip">
        <div class="setup-item" id="zone-srt" ondragover="dragOver(event,'srt')" ondragleave="dragLeave('srt')" ondrop="dropFile(event,'srt')">
          <span class="si-n">1</span>
          <div class="si-body">
            <div class="si-t">字幕 SRT<span class="si-sub">必要，可直接拖進來</span></div>
            <button class="btn-sm">📝 選擇 .srt<input type="file" accept=".srt" onchange="pickFile(event,'srt')"></button>
            <span class="si-s" id="srt-name"></span>
          </div>
        </div>
        <div class="si-div"></div>
        <div class="setup-item" id="zone-xml" ondragover="dragOver(event,'xml')" ondragleave="dragLeave('xml')" ondrop="dropFile(event,'xml')">
          <span class="si-n">2</span>
          <div class="si-body">
            <div class="si-t">剪輯點 XML<span class="si-sub">選填 · 有給才會進對齊</span></div>
            <button class="btn-sm">📋 選擇 .xml<input type="file" accept=".xml" onchange="pickFile(event,'xml')"></button>
            <span class="si-s" id="xml-name"></span>
          </div>
        </div>
        <div class="si-div"></div>
        <div class="setup-item" id="zone-video" ondragover="dragOver(event,'video')" ondragleave="dragLeave('video')" ondrop="dropFile(event,'video')">
          <span class="si-n">3</span>
          <div class="si-body">
            <div class="si-t">影片／音檔<span class="si-sub">選填 · 只在本機播放</span></div>
            <button class="btn-sm">🎬 選擇影片／音檔<input type="file" accept="video/*,audio/*" onchange="pickFile(event,'video')"></button>
            <span class="si-s" id="video-name"></span>
          </div>
        </div>
      </div>
      <div style="font-size:0.7rem;color:#888;margin:14px 0 4px;">或直接把 SRT 內容貼在這裡：</div>
      <textarea class="paste-area" id="rawPaste" placeholder="把字幕 SRT 內容貼在這裡...（跟上面選檔案二選一）" oninput="onPasteInput()"></textarea>
      <div class="row" style="justify-content:center;">
        <button class="btn" id="startBtn" onclick="startFlow()" disabled>開始糾察 →</button>
      </div>
    </div>
  </div>

  <!-- 各階段 iframe -->
  <div id="stage-frame-wrap" style="display:none;">
    <iframe id="stageFrame"></iframe>
  </div>

  <!-- 完成 -->
  <div id="stage-final" style="display:none;">
    <div class="card">
      <div class="card-title">完成！</div>
      <div class="done-icon">✅</div>
      <div style="text-align:center;font-size:0.85rem;color:#4aada5;font-weight:700;margin-bottom:18px;" id="finalMsg">糾察、分段（與對齊）都跑完了</div>
      <div class="row" style="justify-content:center;">
        <button class="btn-ghost" onclick="location.reload()">↺ 重新開始</button>
        <button class="btn" onclick="downloadFinal()">⬇ 下載最終 SRT</button>
      </div>
    </div>
  </div>

</div>

<script>
let srtText = '', xmlText = '', videoFile = null, finalSrt = '';

function onPasteInput() {
  srtText = document.getElementById('rawPaste').value;
  updateStartBtn();
}
function updateStartBtn() {
  document.getElementById('startBtn').disabled = !srtText.trim();
}

function readAsText(file, cb) {
  const r = new FileReader();
  r.onload = e => cb(e.target.result);
  r.readAsText(file, 'UTF-8');
}

function onFile(zone, f) {
  if (zone === 'srt') {
    readAsText(f, t => {
      srtText = t;
      document.getElementById('rawPaste').value = t;
      document.getElementById('srt-name').textContent = f.name;
      document.getElementById('zone-srt').classList.add('loaded');
      updateStartBtn();
    });
  } else if (zone === 'xml') {
    readAsText(f, t => {
      xmlText = t;
      document.getElementById('xml-name').textContent = f.name;
      document.getElementById('zone-xml').classList.add('loaded');
    });
  } else if (zone === 'video') {
    videoFile = f;
    document.getElementById('video-name').textContent = f.name;
    document.getElementById('zone-video').classList.add('loaded');
  }
}
function dragOver(e, zone) { e.preventDefault(); document.getElementById('zone-' + zone).classList.add('dragover'); }
function dragLeave(zone) { document.getElementById('zone-' + zone).classList.remove('dragover'); }
function dropFile(e, zone) {
  e.preventDefault();
  dragLeave(zone);
  const f = e.dataTransfer.files[0];
  if (f) onFile(zone, f);
}
function pickFile(e, zone) {
  const f = e.target.files[0];
  if (f) onFile(zone, f);
}

function b64ToUtf8(b64) {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder('utf-8').decode(bytes);
}

function updateStepBar(n) {
  for (let i = 0; i <= 3; i++) {
    const el = document.getElementById('gs' + i);
    el.classList.remove('active', 'done');
    if (i < n) el.classList.add('done');
    else if (i === n) el.classList.add('active');
  }
}

function startFlow() {
  if (!srtText.trim()) return;
  document.getElementById('stage-upload').style.display = 'none';
  document.getElementById('stage-frame-wrap').style.display = 'block';
  loadStage(1);
}

function loadStage(n) {
  updateStepBar(n);
  const iframe = document.getElementById('stageFrame');
  const html = n === 1 ? b64ToUtf8(MODULE1_B64) : b64ToUtf8(MODULE2_B64);
  iframe.onload = function () {
    const init = { type: 'init', srt: srtText };
    if (n === 2 && xmlText) init.xml = xmlText;
    if (videoFile) init.video = videoFile;
    iframe.contentWindow.postMessage(init, '*');
  };
  iframe.srcdoc = html;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

window.addEventListener('message', function (ev) {
  const d = ev.data || {};
  if (d.type === 'stage1-done') {
    srtText = d.srt;
    loadStage(2);
  } else if (d.type === 'final-done') {
    finalSrt = d.srt;
    showFinal();
  }
});

function showFinal() {
  document.getElementById('stage-frame-wrap').style.display = 'none';
  document.getElementById('stage-final').style.display = 'block';
  updateStepBar(3);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function downloadFinal() {
  if (!finalSrt) return;
  const blob = new Blob([finalSrt], { type: 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  const now = new Date();
  const pad = n => String(n).padStart(2, '0');
  const stamp = now.getFullYear() + pad(now.getMonth() + 1) + pad(now.getDate()) + '_' + pad(now.getHours()) + pad(now.getMinutes());
  a.href = URL.createObjectURL(blob);
  a.download = stamp + '_字幕最終版.srt';
  a.click();
}
</script>
